<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clarify Studio — M0 Demo</title>
<style>
:root{font:15px/1.5 system-ui,Segoe UI,sans-serif;color:#243047;background:#f5f7fb}*{box-sizing:border-box}
body{margin:0}header{background:#152238;color:#fff;padding:17px 24px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:23px;margin:0}header small{color:#bac8df}.layout{display:grid;grid-template-columns:215px 1fr;min-height:calc(100vh - 74px)}
aside{background:#fff;border-right:1px solid #dee4ed;padding:18px 12px}nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px;border-radius:8px;font:inherit;color:#34455f;cursor:pointer}nav button.active,nav button:hover{background:#e7eefb;color:#184b9b;font-weight:600}
main{padding:28px;max-width:1240px;width:100%;margin:auto}.card{background:white;border:1px solid #dce3ef;border-radius:12px;padding:22px;margin-bottom:18px;box-shadow:0 2px 10px #11223308}
h2{margin:0 0 8px;font-size:23px}h3{margin:0 0 10px;font-size:17px}p.muted,.muted{color:#607087}button{cursor:pointer}
.primary{background:#2359ac;border:1px solid #2359ac;color:white;padding:9px 16px;border-radius:7px;font-weight:600}.secondary{background:#fff;border:1px solid #bac7da;color:#23344c;padding:8px 12px;border-radius:7px}
.danger{color:#ba3640}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}.grow{flex:1}
input,select,textarea{font:inherit;border:1px solid #b9c7d8;border-radius:6px;padding:8px 10px;max-width:100%;background:#fff;color:#243047}input:focus,select:focus{outline:2px solid #89a9e5}
table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #e4e9f2;padding:10px 8px;text-align:left}th{font-size:12px;text-transform:uppercase;color:#64748b}td button{border:0;color:#1a5cba;background:transparent;text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:13px;font-weight:600}
.tag{font-size:12px;color:#2359ac;background:#e8f0ff;border-radius:20px;padding:3px 9px}.stat{font-weight:700;font-size:28px}
pre{white-space:pre-wrap;word-break:break-word;background:#12223a;color:#e5eefc;border-radius:8px;padding:18px;max-height:510px;overflow:auto;font-size:13px}
dialog{border:1px solid #a9b8ca;border-radius:12px;padding:24px;min-width:min(550px,90vw);max-width:95vw}dialog::backdrop{background:#10182888}
.notice{border-left:4px solid #2359ac;background:#eaf2ff;padding:12px 15px;margin:12px 0}.error{color:#ac202b}.hidden{display:none!important}
@media(max-width:720px){.layout{grid-template-columns:1fr}aside{padding:8px;overflow-x:auto}nav{display:flex}nav button{white-space:nowrap;width:auto}main{padding:14px}header{padding:12px}}
</style></head>
<body><header><div><h1>◆ Clarify <span style="font-weight:400;color:#a5badb">Studio</span></h1><small>Milestone 0 · offline RAD demonstration</small></div><span class="tag">Local browser prototype</span></header>
<div class="layout"><aside><nav id="nav">
<button data-view="home" class="active">Overview</button><button data-view="dictionary">Data Dictionary</button><button data-view="customers">Customers</button><button data-view="products">Products</button><button data-view="orders">Orders &amp; Lines</button><button data-view="reports">Invoice Report</button><button data-view="generate">C# Source Preview</button></nav></aside>
<main id="app" aria-live="polite"></main></div><dialog id="editor"></dialog>
<script>
"use strict";
const KEY="clarify-m0-demo-v1";
const initial=()=>({next:1003,customers:[{id:1,name:"Acme Aerospace",email:"orders@acme.example",city:"Pasadena"},{id:2,name:"Foothill Instruments",email:"info@foothill.example",city:"La Cañada"}],products:[{id:10,name:"Signal Generator",price:1299.50},{id:11,name:"Digital Multimeter",price:449.00},{id:12,name:"Oscilloscope",price:3199.00}],orders:[{id:1001,customerId:1,date:"2026-10-14",lines:[{productId:10,quantity:1,unitPrice:1299.50},{productId:11,quantity:2,unitPrice:449}]},{id:1002,customerId:2,date:"2026-10-14",lines:[{productId:12,quantity:1,unitPrice:3199}]}],fields:[{entity:"Customer",name:"Name",type:"string",required:true},{entity:"Customer",name:"Email",type:"string",required:false},{entity:"Customer",name:"City",type:"string",required:false},{entity:"Product",name:"Name",type:"string",required:true},{entity:"Product",name:"Price",type:"decimal",required:true},{entity:"Order",name:"Date",type:"date",required:true}]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial()}catch{db=initial()}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=c=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(c);
const total=o=>o.lines.reduce((a,l)=>a+Math.round(l.unitPrice*100)*l.quantity,0)/100;
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert("Could not save data locally: "+e.message)}};
const byId=(list,id)=>list.find(x=>x.id===Number(id));
const app=document.getElementById("app");
const modal=document.getElementById("editor");
let view="home",filter="";
function setView(v){view=v;filter="";document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===v));render()}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-view]");if(b)setView(b.dataset.view)});
const btn=(text,action,style="secondary")=>'<button class="'+style+'" data-action="'+action+'">'+text+'</button>';
function render(){
if(view==="home"){app.innerHTML='<h2>Build database applications faster</h2><p class="muted">A working, zero-install Clarion-inspired concept. Data persists only in this browser; no backend or compiled C# application is involved.</p><div class="grid">'+[['Customers',db.customers.length],['Products',db.products.length],['Orders',db.orders.length],['Order value',money(db.orders.reduce((s,o)=>s+total(o),0))]].map(([t,n])=>'<div class="card"><div class="muted">'+t+'</div><div class="stat">'+n+'</div></div>').join("")+'</div><div class="card"><h3>Try the RAD workflow</h3><p>1. Inspect the dictionary. 2. Add a customer or product. 3. Create an order and add line items. 4. Print an invoice. 5. Examine generated C# entity source.</p><div class="toolbar">'+btn("Data Dictionary","go-dictionary","primary")+btn("Reset sample data","reset")+'</div></div><div class="notice">The dictionary editor demonstrates metadata; changing its fields does not yet migrate persisted tables or regenerate runtime forms. C# is preview-only.</div>';return}
if(view==="dictionary"){app.innerHTML='<h2>Data Dictionary</h2><p class="muted">Field definitions, required flags and type metadata. Prototype-only customization: schema changes are not applied to existing forms.</p><div class="card"><div class="toolbar"><h3 class="grow">Entity definitions</h3>'+btn("+ Add field","field-new","primary")+'</div><table><thead><tr><th>Entity</th><th>Field</th><th>Type</th><th>Required</th><th></th></tr></thead><tbody>'+db.fields.map((f,i)=>'<tr><td>'+esc(f.entity)+'</td><td>'+esc(f.name)+'</td><td>'+esc(f.type)+'</td><td>'+(f.required?"Yes":"No")+'</td><td>'+btn("Edit","field-"+i)+'</td></tr>').join("")+'</tbody></table><p class="muted">Relationships: Order → Customer (many-to-one); Order → OrderLine (one-to-many); OrderLine → Product (many-to-one).</p></div>';return}
if(view==="customers"||view==="products"){const isC=view==="customers",rows=(isC?db.customers:db.products).filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(filter.toLowerCase())));app.innerHTML='<h2>'+(isC?"Customer Browse":"Product Browse")+'</h2><div class="card"><div class="toolbar"><input id="search" aria-label="Search records" placeholder="Search as you type" value="'+esc(filter)+'"><span class="grow"></span>'+btn(isC?"+ Customer":"+ Product","add","primary")+'</div><table><thead><tr>'+(isC?"<th>Name</th><th>Email</th><th>City</th>":"<th>Product</th><th>Unit price</th>")+'<th>Actions</th></tr></thead><tbody>'+rows.map(x=>'<tr>'+(isC?'<td>'+esc(x.name)+'</td><td>'+esc(x.email)+'</td><td>'+esc(x.city)+'</td>':'<td>'+esc(x.name)+'</td><td>'+money(x.price)+'</td>')+'<td>'+btn("Edit","edit-"+x.id)+' '+btn("Delete","delete-"+x.id)+'</td></tr>').join("")+'</tbody></table><p class="muted">'+rows.length+' records shown</p></div>';document.getElementById("search").addEventListener("input",e=>{const pos=e.target.selectionStart;filter=e.target.value;render();document.getElementById("search").focus();document.getElementById("search").setSelectionRange(pos,pos)});return}
if(view==="orders"){app.innerHTML='<h2>Orders &amp; Line Items</h2><div class="card"><div class="toolbar"><h3 class="grow">Master-detail browse</h3>'+btn("+ New order","order-add","primary")+'</div><table><thead><tr><th>#</th><th>Date</th><th>Customer</th><th>Lines</th><th>Total</th><th></th></tr></thead><tbody>'+db.orders.map(o=>'<tr><td>'+o.id+'</td><td>'+esc(o.date)+'</td><td>'+esc(byId(db.customers,o.customerId)?.name||"Missing customer")+'</td><td>'+o.lines.length+'</td><td>'+money(total(o))+'</td><td>'+btn("Edit lines","order-"+o.id)+' '+btn("Invoice","invoice-"+o.id)+'</td></tr>').join("")+'</tbody></table></div>';return}
if(view==="reports"){app.innerHTML='<h2>Invoice Reports</h2><div class="card"><p>Choose an order for a printable HTML invoice with line totals.</p><div class="toolbar"><select id="report-order">'+db.orders.map(o=>'<option value="'+o.id+'">Order '+o.id+' — '+esc(byId(db.customers,o.customerId)?.name||"Unknown")+'</option>').join("")+'</select>'+btn("Preview invoice","report-preview","primary")+'</div><div id="report-preview"></div></div>';return}
if(view==="generate"){app.innerHTML='<h2>Generated C# Preview</h2><p class="muted">Illustrative entity classes from the model. Not yet a compiling generator, migrations, or a standalone .NET application.</p><div class="card">'+btn("Copy source","copy-cs","primary")+'<pre id="generated">'+esc(generate())+'</pre></div>';return}
}
function generate(){const lines=["// Clarify M0 — illustrative generated entity source","using System;","using System.Collections.Generic;","namespace Clarify.Generated;",""];for(const name of ["Customer","Product","Order"]){lines.push("public partial class "+name,"{","    public long Id { get; set; }");for(const f of db.fields.filter(f=>f.entity===name)){const type=f.type==="decimal"?"decimal":f.type==="date"?"DateOnly":"string";const prop=f.name.replace(/[^a-zA-Z0-9_]/g,"");if(!prop)continue;lines.push("    public "+type+(type==="string"?"":"")+" "+prop+" { get; set; }"+(type==="string"?' = "";':""))}if(name==="Order")lines.push("    public long CustomerId { get; set; }","    public List<OrderLine> Lines { get; set; } = new();");lines.push("}","")}lines.push("public partial class OrderLine","{","    public long ProductId { get; set; }","    public int Quantity { get; set; }","    public decimal UnitPrice { get; set; }","}");return lines.join("\n")}
const input=(name,label,value="",type="text",extra="")=>'<div class="field"><label for="f-'+name+'">'+label+'</label><input id="f-'+name+'" name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+extra+'></div>';
function showForm(title,body,save){modal.innerHTML='<form method="dialog" id="edit-form"><h2>'+esc(title)+'</h2><div class="grid">'+body+'</div><p id="form-error" class="error" role="alert"></p><div class="toolbar" style="justify-content:flex-end">'+btn("Cancel","close")+ '<button class="primary" type="submit">Save</button></div></form>';modal.showModal();modal.querySelector("#edit-form").addEventListener("submit",e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));try{save(data);modal.close();persist();render()}catch(err){modal.querySelector("#form-error").textContent=err.message}})}
function entityForm(id){const isC=view==="customers",list=isC?db.customers:db.products,item=id?byId(list,id):null;showForm(isC?"Customer":"Product",(isC?input("name","Name",item?.name||"","text","required")+input("email","Email",item?.email||"","email")+input("city","City",item?.city||""):input("name","Product name",item?.name||"","text","required")+input("price","Unit price",item?.price??"","number",'required min="0" step="0.01"')),(d)=>{if(!d.name.trim())throw Error("Name is required");if(!isC&&(!Number.isFinite(+d.price)||+d.price<0||!/^\d+(\.\d{1,2})?$/.test(d.price)))throw Error("Enter a nonnegative price with at most two decimals");const o=isC?{name:d.name.trim(),email:d.email,city:d.city}:{name:d.name.trim(),price:+d.price};if(item)Object.assign(item,o);else list.push({id:db.next++,...o})})}
function orderForm(id){let o=id?byId(db.orders,id):null;if(!db.customers.length) return alert("Create a customer first");if(!o){o={id:db.next++,customerId:db.customers[0].id,date:new Date().toISOString().slice(0,10),lines:[]};db.orders.push(o);persist()}const options=db.customers.map(c=>'<option value="'+c.id+'" '+(c.id===o.customerId?"selected":"")+'>'+esc(c.name)+'</option>').join("");modal.innerHTML='<div><h2>Order '+o.id+'</h2><div class="toolbar"><label>Customer <select id="order-customer">'+options+'</select></label><label>Date <input type="date" id="order-date" value="'+esc(o.date)+'"></label></div><table><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th><th></th></tr></thead><tbody>'+o.lines.map((l,i)=>'<tr><td>'+esc(byId(db.products,l.productId)?.name||"Unknown")+'</td><td>'+l.quantity+'</td><td>'+money(l.unitPrice)+'</td><td>'+money(l.quantity*l.unitPrice)+'</td><td>'+btn("Remove","line-remove-"+i)+'</td></tr>').join("")+'</tbody></table><div class="toolbar"><strong class="grow">Total: '+money(total(o))+'</strong>'+btn("+ Add line","line-add","primary")+'</div><div class="toolbar" style="justify-content:flex-end">'+btn("Done","order-close","primary")+'</div></div>';modal.showModal();modal.querySelector("#order-customer").addEventListener("change",e=>{o.customerId=+e.target.value;persist();render()});modal.querySelector("#order-date").addEventListener("change",e=>{o.date=e.target.value;persist();render()});modal.querySelectorAll('[data-action^="line-remove-"]').forEach(b=>b.addEventListener("click",()=>{o.lines.splice(+b.dataset.action.split("-")[2],1);persist();orderFormRefresh(o.id)}));modal.querySelector('[data-action="line-add"]').addEventListener("click",()=>lineForm(o.id));modal.querySelector('[data-action="order-close"]').addEventListener("click",()=>{modal.close();render()})}
function orderFormRefresh(id){modal.close();orderForm(id)}
function lineForm(orderId){const o=byId(db.orders,orderId);if(!db.products.length)return alert("Create a product first");modal.close();showForm("Add order line",'<div class="field"><label for="f-product">Product</label><select id="f-product" name="product">'+db.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join("")+'</select></div>'+input("quantity","Quantity",1,"number",'required min="1" max="100000" step="1"'),d=>{const p=byId(db.products,d.product),q=Number(d.quantity);if(!p||!Number.isSafeInteger(q)||q<1||q>100000)throw Error("Invalid product or quantity");o.lines.push({productId:p.id,quantity:q,unitPrice:p.price});});modal.addEventListener("close",()=>{if(view==="orders")render()},{once:true})}
function invoice(id){const o=byId(db.orders,id),c=byId(db.customers,o.customerId);if(!o)return "";return '<section class="card" style="margin-top:15px"><h2>Invoice #'+o.id+'</h2><p>'+esc(o.date)+'<br>'+esc(c?.name||"Unknown customer")+'<br>'+esc(c?.city||"")+'</p><table><thead><tr><th>Product</th><th>Qty</th><th>Unit</th><th>Extended</th></tr></thead><tbody>'+o.lines.map(l=>'<tr><td>'+esc(byId(db.products,l.productId)?.name||"Unknown")+'</td><td>'+l.quantity+'</td><td>'+money(l.unitPrice)+'</td><td>'+money(l.unitPrice*l.quantity)+'</td></tr>').join("")+'</tbody></table><h3 style="text-align:right">Total '+money(total(o))+'</h3>'+btn("Print","print","primary")+'</section>'}
app.addEventListener("click",async e=>{const b=e.target.closest("button[data-action]");if(!b)return;const a=b.dataset.action;if(a.startsWith("go-"))return setView(a.slice(3));if(a==="reset"){if(confirm("Reset all local demo data?")){db=initial();persist();render()}return}if(a==="add")return entityForm(null);if(a.startsWith("edit-"))return entityForm(+a.slice(5));if(a.startsWith("delete-")){const id=+a.slice(7);if(view==="customers"&&db.orders.some(o=>o.customerId===id))return alert("Cannot delete customer: orders reference this record");if(view==="products"&&db.orders.some(o=>o.lines.some(l=>l.productId===id)))return alert("Cannot delete product: order lines reference it");if(confirm("Delete this record?")){db[view]=db[view].filter(x=>x.id!==id);persist();render()}return}if(a==="order-add")return orderForm(null);if(a.startsWith("order-"))return orderForm(+a.slice(6));if(a.startsWith("invoice-")){setView("reports");document.getElementById("report-order").value=a.slice(8);document.getElementById("report-preview").innerHTML=invoice(+a.slice(8));return}if(a==="report-preview"){document.getElementById("report-preview").innerHTML=invoice(+document.getElementById("report-order").value);return}if(a==="print")return window.print();if(a==="copy-cs"){try{await navigator.clipboard.writeText(generate());b.textContent="Copied"}catch{alert("Clipboard access blocked; select text from preview instead")}return}if(a==="field-new"||a.startsWith("field-")){const idx=a==="field-new"?-1:+a.slice(6),f=db.fields[idx];return showForm("Dictionary field",'<div class="field"><label for="f-entity">Entity</label><select name="entity" id="f-entity">'+["Customer","Product","Order"].map(n=>'<option '+(f?.entity===n?"selected":"")+'>'+n+'</option>').join("")+'</select></div>'+input("name","Field name",f?.name||"","text","required")+'<div class="field"><label for="f-type">Type</label><select name="type" id="f-type">'+["string","decimal","date","int"].map(n=>'<option '+(f?.type===n?"selected":"")+'>'+n+'</option>').join("")+'</select></div><div class="field"><label for="f-required">Required</label><select name="required" id="f-required"><option value="true" '+(f?.required?"selected":"")+'>Yes</option><option value="false" '+(!f?.required?"selected":"")+'>No</option></select></div>',d=>{if(!/^[A-Za-z_][A-Za-z_0-9]*$/.test(d.name))throw Error("Use a valid C# identifier");if(db.fields.some((x,i)=>i!==idx&&x.entity===d.entity&&x.name.toLowerCase()===d.name.toLowerCase()))throw Error("Duplicate field");const v={entity:d.entity,name:d.name,type:d.type,required:d.required==="true"};if(idx<0)db.fields.push(v);else db.fields[idx]=v})}});
modal.addEventListener("click",e=>{if(e.target.closest('[data-action="close"]'))modal.close()});
render();
</script></body></html>
