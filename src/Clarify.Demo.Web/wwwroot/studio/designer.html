<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Clarify Studio — Form Canvas</title><style>body{font:15px system-ui;margin:0;background:#eef2f8;color:#172c44}header{display:none}main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;padding:14px}.panel{background:white;padding:20px;border-radius:12px}textarea{width:100%;height:540px;background:#12223a;color:white;padding:15px;box-sizing:border-box}#canvas{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:75px;gap:8px;background:#f1f5fc;padding:15px;min-height:380px}.field{background:white;border:2px solid #8bb3e1;border-radius:7px;padding:10px;cursor:move}button,select,input{padding:8px;margin:5px}#errors{color:#b30f35;white-space:pre-wrap}@media(max-width:800px){main{grid-template-columns:1fr}}</style></head><body><header><h1>ClarifyDSL — Live Form Designer</h1>Dictionary → DSL ⇄ Visual Canvas</header><main><section class="panel"><label>Entity <select id="entity"></select></label><button id="generate">Generate from schema</button><div id="canvas"></div><div><strong id="selected">Select field</strong><label>X <input id="x" type="number" min="1" size="3"></label><label>Y <input id="y" type="number" min="1"></label><label>W <input id="w" type="number" min="1"></label><label>H <input id="h" type="number" min="1"></label><button id="apply">Apply</button></div><div id="errors"></div></section><section class="panel"><h2>Source (.clarify)</h2><button id="save">Save Customer.clarify</button><button id="download">Download DSL</button><span id="save-state" role="status"></span><textarea id="source" spellcheck="false"></textarea><p>Changes in either view update the other. Invalid source keeps the last valid preview.</p></section></main><script type="module">
import{schemaForm,parse,patchField}from'./clarifydsl.mjs';
import{instantiateTemplate}from'./templates.mjs';
const schema=await fetch('/studio/dictionary.json').then(r=>{if(!r.ok)throw Error('Could not load dictionary');return r.json()});
const $=id=>document.getElementById(id);let src='',tree=null,selected=null,revision=null;
schema.entities.forEach(e=>{const o=document.createElement('option');o.value=e.name;o.textContent=e.name;$('entity').append(o)});
function update(v){src=v;$('save-state').textContent='Unsaved changes';$('source').value=v;const p=parse(v,schema);$('errors').textContent=p.errors.join('\n');if(p.ok){tree=p;draw()}try{localStorage.setItem('clarify-studio-dsl',v)}catch{}}
function draw(){if(!tree)return;const g=$('canvas');g.replaceChildren();g.style.gridTemplateColumns='repeat('+tree.columns+',1fr)';for(const c of tree.controls){const el=document.createElement('div');el.className='field';el.textContent=c.name;el.style.gridColumn=c.x+' / span '+c.w;el.style.gridRow=c.y+' / span '+c.h;el.onclick=()=>select(c.id);el.onpointerdown=e=>{const start=[e.clientX,e.clientY],box=g.getBoundingClientRect();el.setPointerCapture(e.pointerId);el.onpointerup=ev=>{const x=Math.max(1,Math.min(tree.columns-c.w+1,c.x+Math.round((ev.clientX-start[0])/(box.width/tree.columns))));const y=Math.max(1,c.y+Math.round((ev.clientY-start[1])/83));move(c.id,{x,y});el.onpointerup=null}};g.append(el)}select(selected||tree.controls[0]?.id)}
function select(id){selected=id;const c=tree?.controls.find(x=>x.id===id);$('selected').textContent=c?.name||'Select field';for(const k of ['x','y','w','h'])$(k).value=c?.[k]||''}
function move(id,change){try{update(patchField(src,schema,id,change));select(id)}catch(e){$('errors').textContent=e.message}}
$('source').oninput=e=>{src=e.target.value;update(src)};$('apply').onclick=()=>move(selected,Object.fromEntries(['x','y','w','h'].map(k=>[k,Number($(k).value)])));
$('generate').onclick=()=>update(schemaForm(schema,$('entity').value));
$('download').onclick=()=>{
 if(!tree||!parse(src,schema).ok){$('save-state').textContent='Fix DSL errors before export';return}
 const blob=new Blob([src],{type:'text/plain;charset=utf-8'});
 const url=URL.createObjectURL(blob),anchor=document.createElement('a');
 anchor.href=url;anchor.download=tree.form+'.clarify';anchor.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
};
$('save').onclick=async()=>{
 if(!tree || !parse(src,schema).ok){$('save-state').textContent='Fix DSL errors before saving';return}
 if(tree.entity!=='Customer'){$('save-state').textContent='Only Customer is writable in M0';return}
 if(!revision){$('save-state').textContent='Reload project source before saving';return}
 try {
  const res=await fetch('/api/studio/forms/Customer',{method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({source:src,revision})});
  const data=await res.json();
  if(!res.ok)throw Error(data.error||JSON.stringify(data));
  revision=data.revision;$('save-state').textContent='Saved to project source';
 }catch(e){$('save-state').textContent='Save failed: '+e.message}
};
async function loadProject(){
 try{
  const r=await fetch('/api/studio/forms/Customer');
  if(!r.ok)throw Error('Source unavailable');
  const data=await r.json();revision=data.revision;update(data.source);
  $('save-state').textContent='Loaded from project source';
 }catch(e){$('save-state').textContent='Local preview only: '+e.message}
}
async function initialize(){
 const params=new URLSearchParams(location.search);
 if(params.get('sample')||params.get('template')==='master-detail'){
  try{
   const isSample=Boolean(params.get('sample'));
   const template=await fetch(isSample?'./samples/'+encodeURIComponent(params.get('sample'))+'.json':'./master-detail-template.json').then(r=>r.json());
   const bindings=isSample?{Entity:params.get('parent'),...(params.get('child')?{Detail:params.get('child')}:{} )}:{Parent:params.get('parent'),Child:params.get('child')};
   const generated=instantiateTemplate(template,schema,bindings);
   const chosen=generated.files.find(f=>f.entity===params.get('form'));
   if(!chosen)throw Error('Unknown template form selection');
   $('entity').value=chosen.entity;
   update(chosen.source);
   $('save').disabled=true;
   $('save-state').textContent='Template preview: download DSL to preserve changes; project save is not available for this form.';
  }catch(e){$('errors').textContent=e.message}
  return;
 }
 update(localStorage.getItem('clarify-studio-dsl')||schemaForm(schema,'Customer'));
 await loadProject();
}
initialize();
</script></body></html>
