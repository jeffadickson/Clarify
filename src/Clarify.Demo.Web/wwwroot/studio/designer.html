<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Clarify Studio — Form Canvas</title><style>body{font:15px system-ui;margin:0;background:#eef2f8;color:#172c44}header{display:none}main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;padding:14px}.panel{background:white;padding:20px;border-radius:12px}textarea{width:100%;height:540px;background:#12223a;color:white;padding:15px;box-sizing:border-box}#canvas{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:75px;gap:8px;background:#f1f5fc;padding:15px;min-height:380px}.field{background:white;border:2px solid #8bb3e1;border-radius:7px;padding:10px;cursor:move}button,select,input{padding:8px;margin:5px}#errors{color:#b30f35;white-space:pre-wrap}@media(max-width:800px){main{grid-template-columns:1fr}}</style></head><body><header><h1>ClarifyDSL — Live Form Designer</h1>Dictionary → DSL ⇄ Visual Canvas</header><main><section class="panel"><label>Entity <select id="entity"></select></label><button id="generate">Generate from schema</button><div id="canvas"></div><div><strong id="selected">Select field</strong><label>X <input id="x" type="number" min="1" size="3"></label><label>Y <input id="y" type="number" min="1"></label><label>W <input id="w" type="number" min="1"></label><label>H <input id="h" type="number" min="1"></label><button id="apply">Apply</button></div><div id="errors"></div></section><section class="panel"><h2>Source (.clarify)</h2><textarea id="source" spellcheck="false"></textarea><p>Changes in either view update the other. Invalid source keeps the last valid preview.</p></section></main><script type="module">
import{schemaForm,parse,patchField}from'./clarifydsl.mjs';
const schema=await fetch('/studio/dictionary.json').then(r=>{if(!r.ok)throw Error('Could not load dictionary');return r.json()});
const $=id=>document.getElementById(id);let src='',tree=null,selected=null;
schema.entities.forEach(e=>{const o=document.createElement('option');o.value=e.name;o.textContent=e.name;$('entity').append(o)});
function update(v){src=v;$('source').value=v;const p=parse(v,schema);$('errors').textContent=p.errors.join('\n');if(p.ok){tree=p;draw()}try{localStorage.setItem('clarify-studio-dsl',v)}catch{}}
function draw(){if(!tree)return;const g=$('canvas');g.replaceChildren();g.style.gridTemplateColumns='repeat('+tree.columns+',1fr)';for(const c of tree.controls){const el=document.createElement('div');el.className='field';el.textContent=c.name;el.style.gridColumn=c.x+' / span '+c.w;el.style.gridRow=c.y+' / span '+c.h;el.onclick=()=>select(c.id);el.onpointerdown=e=>{const start=[e.clientX,e.clientY],box=g.getBoundingClientRect();el.setPointerCapture(e.pointerId);el.onpointerup=ev=>{const x=Math.max(1,Math.min(tree.columns-c.w+1,c.x+Math.round((ev.clientX-start[0])/(box.width/tree.columns))));const y=Math.max(1,c.y+Math.round((ev.clientY-start[1])/83));move(c.id,{x,y});el.onpointerup=null}};g.append(el)}select(selected||tree.controls[0]?.id)}
function select(id){selected=id;const c=tree?.controls.find(x=>x.id===id);$('selected').textContent=c?.name||'Select field';for(const k of ['x','y','w','h'])$(k).value=c?.[k]||''}
function move(id,change){try{update(patchField(src,schema,id,change));select(id)}catch(e){$('errors').textContent=e.message}}
$('source').oninput=e=>{src=e.target.value;update(src)};$('apply').onclick=()=>move(selected,Object.fromEntries(['x','y','w','h'].map(k=>[k,Number($(k).value)])));
$('generate').onclick=()=>update(schemaForm(schema,$('entity').value));
update(localStorage.getItem('clarify-studio-dsl')||schemaForm(schema,'Customer'));
</script></body></html>
