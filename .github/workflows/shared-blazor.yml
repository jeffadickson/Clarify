name: Shared Blazor + DSL
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Record CI run identity
        run: |
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "SHA: $GITHUB_SHA"
          echo "Ref: $GITHUB_REF"
          echo "Run URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "## Clarify CI diagnostic"
            echo "- Event: \`$GITHUB_EVENT_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: node --test tests/template-gallery-count.test.mjs tests/form-controls.test.mjs tests/sample-template-catalog.test.mjs designer/templates.test.mjs designer/dependencies.test.mjs designer/schema.test.mjs tests/er-layout.test.mjs tests/studio-integration.test.mjs designer/clarifydsl.test.mjs workflow/workflowdsl.test.mjs workflow/compile.test.mjs workflow/elsa-manifest.test.mjs
      - run: node --test tests/equipment-checkout.test.mjs tests/ef-generation.test.mjs tests/sqlite-migrations.test.mjs
      - run: node tools/generate-ef-models.mjs
      - run: git diff --exit-code -- examples/relational-generation/generated/SalesDbContext.g.cs
      - run: node workflow/compile.mjs
      - run: git diff --exit-code -- examples/workflows/OrderApproval.plan.json
      - run: node --test tests/automatic-observability.test.mjs
      - run: node tools/generate-observability.mjs
      - run: git diff --exit-code -- src/Clarify.Demo.Web/GeneratedObservability.cs
      - run: node --test tests/standard-value-types.test.mjs tests/async-generator.test.mjs
      - run: node tools/generate-async-contracts.mjs
      - run: git diff --exit-code -- examples/generated/AsyncStores.g.cs
      - run: node tools/generate-shared-blazor.mjs
      - run: node --test tests/documentation-generation.test.mjs
      - run: node tools/audit-csharp-docs.mjs --report --strict-generated
      - run: git diff --exit-code -- src/Clarify.Forms.Shared/CustomerFields.razor
      - run: dotnet restore tests/Clarify.M0.Tests/Clarify.M0.Tests.csproj
      - run: dotnet build src/Clarify.Demo.Web/Clarify.Demo.Web.csproj -c Release
      - run: node tools/export-dsl-parity-fixtures.mjs
      - run: dotnet test tests/Clarify.Dsl.Tests/Clarify.Dsl.Tests.csproj -c Release --logger trx
      - run: dotnet test tests/Clarify.M0.Tests/Clarify.M0.Tests.csproj -c Release --logger trx
      - run: dotnet run --project examples/relational-generation/RelationalGeneration.Smoke.csproj -c Release
      - run: bash scripts/smoke-sqlite-migrations.sh
      - run: bash scripts/smoke-equipment-checkout.sh
      - name: Smoke running web host and Studio
        run: bash scripts/smoke-web.sh
      - run: dotnet publish src/Clarify.Demo.Web/Clarify.Demo.Web.csproj -c Release -o artifacts/web
      - name: Install Chromium UI test dependencies
        run: |
          npm install --prefix tests/browser --no-audit --no-fund
          ./tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Playwright Studio ER diagram browser tests
        run: ./tests/browser/node_modules/.bin/playwright test --config tests/browser/playwright.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clarify-playwright
          path: artifacts/playwright-report
          if-no-files-found: ignore
      - name: Build XML documentation reference with DocFX
        run: |
          dotnet tool restore
          dotnet docfx docs/docfx.json
      - uses: actions/upload-artifact@v4
        with:
          name: clarify-documentation
          path: |
            docs/_site
            artifacts/documentation-coverage.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: clarify-web
          path: artifacts/web
          if-no-files-found: error
  desktop:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install maui
      - run: dotnet build src/Clarify.Demo.Desktop/Clarify.Demo.Desktop.csproj -f net10.0-windows10.0.19041.0 -c Release
