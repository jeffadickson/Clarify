name: Shared Blazor + DSL
on:
  push:
    paths:
      - 'src/**'
      - 'designer/**'
      - 'tools/generate-shared-blazor.mjs'
      - 'examples/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/shared-blazor.yml'
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: node --test designer/schema.test.mjs tests/studio-integration.test.mjs designer/clarifydsl.test.mjs workflow/workflowdsl.test.mjs workflow/compile.test.mjs workflow/elsa-manifest.test.mjs
      - run: node workflow/compile.mjs
      - run: git diff --exit-code -- examples/workflows/OrderApproval.plan.json
      - run: node --test tests/automatic-observability.test.mjs
      - run: node tools/generate-observability.mjs
      - run: git diff --exit-code -- src/Clarify.Demo.Web/GeneratedObservability.cs
      - run: node tools/generate-shared-blazor.mjs
      - run: git diff --exit-code -- src/Clarify.Forms.Shared/CustomerFields.razor
      - run: dotnet restore tests/Clarify.M0.Tests/Clarify.M0.Tests.csproj
      - run: dotnet build src/Clarify.Demo.Web/Clarify.Demo.Web.csproj -c Release
      - run: dotnet test tests/Clarify.M0.Tests/Clarify.M0.Tests.csproj -c Release --logger trx
      - name: Smoke running web host and Studio
        run: bash scripts/smoke-web.sh
      - run: dotnet publish src/Clarify.Demo.Web/Clarify.Demo.Web.csproj -c Release -o artifacts/web
      - uses: actions/upload-artifact@v4
        with:
          name: clarify-web
          path: artifacts/web
          if-no-files-found: error
  desktop:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install maui
      - run: dotnet build src/Clarify.Demo.Desktop/Clarify.Demo.Desktop.csproj -f net10.0-windows10.0.19041.0 -c Release
