name: CI Diagnostics (Fast)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  environment:
    name: Runner and repository visibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Print workflow diagnostics
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "SHA: $GITHUB_SHA"
          echo "Ref: $GITHUB_REF"
          echo "Runner: $RUNNER_OS"
          git log -1 --format='%h %s'
          node --version
          pwd
      - name: Check workflow and source prerequisites
        run: |
          test -f .github/workflows/shared-blazor.yml
          test -f src/Clarify.Dsl/ClarifyFormParser.cs
          test -f designer/clarifydsl.mjs
          test -f examples/equipment-checkout/Program.cs
          echo "Source prerequisites found"
  node:
    name: Node tests and generated source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Basic Node compatibility
        run: |
          node --version
          node --test designer/schema.test.mjs designer/clarifydsl.test.mjs designer/dependencies.test.mjs
      - name: Generator regression tests
        run: |
          node --test tests/equipment-checkout.test.mjs tests/ef-generation.test.mjs tests/sqlite-migrations.test.mjs tests/async-generator.test.mjs
  dotnet:
    name: .NET restore and parser build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Environment
        run: dotnet --info
      - name: Restore native parser
        run: dotnet restore tests/Clarify.Dsl.Tests/Clarify.Dsl.Tests.csproj --verbosity normal
      - name: Build native parser
        run: dotnet build tests/Clarify.Dsl.Tests/Clarify.Dsl.Tests.csproj --no-restore -c Release
